<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emulador SNES</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        
        /* Estilos do Menu */
        #menu { background: #222; padding: 30px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        select { padding: 10px; font-size: 16px; margin-bottom: 20px; width: 100%; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0064ff; color: white; border: none; border-radius: 4px; width: 100%; font-weight: bold; }
        button:hover { background: #0052cc; }

        /* Container do Emulador (escondido por padrão) */
        .emulator-container { width: 800px; height: 600px; max-width: 100%; display: none; }
    </style>
</head>
<body>

    <!-- Menu de Seleção -->
    <div id="menu">
        <h2>Selecione o Jogo</h2>
        <select id="gameSelect">
            <!-- Adicione suas ROMs aqui. O value é o caminho do arquivo -->
            <option value="/roms/super-mario-world.smc">Super Mario World</option>
            <option value="/roms/donkey-kong-country.smc">Donkey Kong Country</option>
            <option value="/roms/zelda.smc">Zelda: A Link to the Past</option>
        </select>
        <button onclick="startGame()">Iniciar Emulador</button>
    </div>

    <!-- Emulador -->
    <div class="emulator-container" id="emulatorWrapper">
        <div id="game"></div>
    </div>

    <script>
        function startGame() {
            const select = document.getElementById('gameSelect');
            const romUrl = select.value;
            const gameName = select.options[select.selectedIndex].text;

            // Oculta o menu e exibe a div do emulador
            document.getElementById('menu').style.display = 'none';
            document.getElementById('emulatorWrapper').style.display = 'block';

            // Configura as variáveis do EmulatorJS
            window.EJS_player = '#game';
            window.EJS_core = 'snes';
            window.EJS_gameName = gameName;
            window.EJS_color = '#0064ff';
            window.EJS_startOnLoaded = true;
            window.EJS_language = 'en-US';
            window.EJS_gameUrl = romUrl; 
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            // Injeta o loader do emulador dinamicamente na página
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
